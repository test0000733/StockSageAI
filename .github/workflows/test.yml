name: CI - Test & Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      continue-on-error: true
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 StockSageAI --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 StockSageAI --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Compile Python Files
      run: |
        python -m py_compile StockSageAI/app.py
        python -m py_compile StockSageAI/advanced_search_ui.py
        python -m py_compile StockSageAI/utils.py
        python -m py_compile StockSageAI/auth.py
        python -m py_compile StockSageAI/database.py
        python -m py_compile StockSageAI/data_fetcher.py

    - name: Security check with bandit
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r StockSageAI -ll

    - name: Check dependencies
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: stocksageai:test
